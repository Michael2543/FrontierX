name: M3 controlled compatibility gates
on:
  workflow_dispatch:
    inputs:
      gpu_host_setup:
        description: Explicit Linux GPU desktop setup (ordinary default retained)
        type: choice
        options: [ordinary, hyprland-x11]
        default: ordinary
permissions:
  contents: read
concurrency:
  group: frontierx-m3-controlled
  cancel-in-progress: false

# No pull_request/pull_request_target trigger. These persistent runners and
# their external inputs must only execute reviewed default-branch code.
jobs:
  linux:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Linux, X64, frontierx-m3-linux]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
        scope: [default, optional, sanitizers]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 Tools/ci/linux_m3.py --compiler ${{ matrix.compiler }} --scope ${{ matrix.scope }}
      - if: matrix.scope == 'default'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crt-${{ matrix.compiler }}
          path: out/m3-synthetic/${{ matrix.compiler }}.json
          if-no-files-found: error
          retention-days: 3

  linux-host-gpu:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Linux, X64, frontierx-m3-linux-gpu]
    env:
      FRONTIERX_M3_GPU_SETUP: ${{ inputs.gpu_host_setup == 'hyprland-x11' && 'hyprland-x11' || '' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 Tools/ci/linux_m3.py --compiler ${{ matrix.compiler }} --scope gpu

  linux-host-mission:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Linux, X64, frontierx-m3-linux-gpu]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
        frame_input: [measured, fixed-source-period]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 Tools/ci/linux_m3.py --compiler ${{ matrix.compiler }} --scope mission --frame-input ${{ matrix.frame_input }}

  linux-host-mission-sanitizers:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Linux, X64, frontierx-m3-linux-gpu]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
        frame_input: [measured, fixed-source-period]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 Tools/ci/linux_m3.py --compiler ${{ matrix.compiler }} --scope mission-sanitizers --frame-input ${{ matrix.frame_input }}

  linux-cross-build:
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    needs: [linux-host-mission, linux-host-mission-sanitizers]
    runs-on: [self-hosted, Linux, X64, frontierx-m3-linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - run: python3 Tools/ci/cross_m3.py

  windows-native:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Windows, X64, frontierx-m3-windows]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - shell: powershell
        run: ./Tools/ci/windows_m3.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crt-windows
          path: out/m3-synthetic/windows.json
          if-no-files-found: error
          retention-days: 3

  windows-host-mission:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: frontierx-m3-controlled
    runs-on: [self-hosted, Windows, X64, frontierx-m3-windows-gpu]
    needs: windows-native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - shell: powershell
        run: ./Tools/ci/windows_mission_m3.ps1

  crt-cross-build:
    # CPU sanitizer failures must not hide independent available CRT evidence.
    if: always() && needs.windows-native.result == 'success'
    needs: [linux, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: crt-*
          path: out/crt
          merge-multiple: true
      - run: python3 Tools/portability/m3_compare.py rng out/crt/gcc.json out/crt/clang.json
      # Known incompatible CRT contract remains a real failure, not an xfail.
      - run: python3 Tools/portability/m3_compare.py rng out/crt/gcc.json out/crt/windows.json

  acceptance:
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [linux, linux-host-gpu, linux-host-mission, linux-host-mission-sanitizers, linux-cross-build, windows-native, windows-host-mission, crt-cross-build]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'M3 BLOCKED: full semantic RNG/script/order capture and equivalent save/reload continuation remain incomplete.'
          echo 'Partial observer and CRT characterization cannot satisfy the simulation or retail acceptance criteria.'
          exit 1
